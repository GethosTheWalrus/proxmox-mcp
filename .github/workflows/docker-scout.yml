name: Docker Scout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 8 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: docker-scout-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  scan-container:
    name: Scan container image
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_TAG: proxmox-mcp:${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Check Docker Scout credentials
        id: scout-credentials
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::notice::Skipping Docker Scout because Docker Hub secrets are unavailable to this pull request."
            exit 0
          fi

          echo "::error::Docker Scout requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
          echo "Create a Docker Hub access token and add both secrets, then rerun this workflow."
          exit 1

      - name: Build image locally
        if: ${{ steps.scout-credentials.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Docker Scout
        if: ${{ steps.scout-credentials.outputs.enabled == 'true' }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ env.IMAGE_TAG }}
          dockerhub-user: ${{ env.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ env.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          only-fixed: true
          sarif-file: docker-scout.sarif.json
          summary: true
          exit-code: true
          write-comment: false

      - name: Upload Docker Scout SARIF
        if: ${{ always() && steps.scout-credentials.outputs.enabled == 'true' && hashFiles('docker-scout.sarif.json') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: docker-scout.sarif.json
